<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스와이퍼(Swiper) - 자바스크립트 플러그인</title>
    <link rel="stylesheet" href="../styles/reset.css">
    <!--swiper 필수 css cdn 연결-->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <!--swiper 필수 JS cdn 연결-->
    <script src="https://unpkg.com/swiper/swiper-bundle.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <style>
        /* 내부스타일시트 작성위치 */
        .event_bnr1 { /* 슬라이드가 보이는 영역 */
            width:600px; margin:20px auto;
            background-color: aqua;
            overflow: hidden;
        }
        .event_bnr1 .wrapper {
            display: flex; flex-flow: row nowrap;  width:max-content;
            transform:translateX(-200px);
        }
        .event_bnr1 .wrapper .slide {
            width:200px; height:300px;
            border:2px solid #000;
        }
        .event_bnr1 .wrapper .slide:nth-child(even) {border-color:#f00;} /* even:짝수번째 */
        /* ----------------------------------------슬라이드2 */
        .event_bnr2 {
            /* 기본값 : overflow: hidden;  */
            width:800px; height:300px;
            margin:30px auto; background-color: lime;
        } /* 시작선택자는 공통클래스(swiper)가 아닌 개별명으로 */
        .event_bnr2 .swiper-wrapper {
            /* 기본값 : flex, row nowrap,relative, max-content(윗줄은 css 내장)
            translateX(js내장) */
        }
        .event_bnr2 .swiper-wrapper .swiper-slide {
            /* 기본값 : relative */
            border:3px solid red; background: #ff0;
            /* 주의사항 : slide가로크기는 JS에서만 명시가능. css(x) 절대주면 안됨 */
            height:300px;
        }
        /* ---------------------------------------슬라이드3 */
        .event_bnr3 {
            width:900px; height:400px;
            margin: 30px auto; background-color: coral;
        }
        .event_bnr3 .swiper-wrapper {}
        .event_bnr3 .swiper-wrapper .swiper-slide {
            border:2px solid red;
            height:400px;
            background:lightblue;
        }
    </style>
</head>
<body>
    <h1>Swiper Plugin-1</h1>
    <div class="event_bnr1"><!-- 슬라이드가 보이는 영역 -->
        <div class="wrapper"><!-- 슬라이드들을 묶는 부모(실제 움직이는 대상) -->
            <div class="slide">슬라이드1</div><!-- 개별슬라이드 -->
            <div class="slide">슬라이드2</div>
            <div class="slide">슬라이드3</div>
            <div class="slide">슬라이드4</div>
        </div>
    </div>
    <h1>Swiper Plugin-2</h1>
    <!-- div.swiper>div.swiper-wrapper>div.swiper-slide*개수 -->
    <!-- 시작 swiper태그엔 반드시 한칸 띄고 별개의 클래스이름설정하기 -->
    <!-- 태그만 작성시에 슬라이드1만 보이는 게 정상 -->
    <div class="swiper event_bnr2"><!-- 슬라이드가 보이는 영역 -->
        <div class="swiper-wrapper"><!-- 슬라이드들을 묶는 부모(실제 움직이는 대상) -->
            <div class="swiper-slide">슬라이드1</div><!-- 개별슬라이드 -->
            <div class="swiper-slide">슬라이드2</div>
            <div class="swiper-slide">슬라이드3</div>
            <div class="swiper-slide">슬라이드4</div>
        </div>
    </div>
    <!-- -------------------------------------연습3 -->
    <!-- 태그 규칙 지키기 ->css기본값 체크하면서 필요한 값 적용 -> js 적용 -->
    <h1>Swiper Plugin-3</h1>
    <div class="swiper event_bnr3">
        <div class="swiper-wrapper">
            <div class="swiper-slide">슬라이드1</div>
            <div class="swiper-slide">슬라이드2</div>
            <div class="swiper-slide">슬라이드3</div>
            <div class="swiper-slide">슬라이드4</div>
            <div class="swiper-slide">슬라이드5</div>
        </div>
    </div>
    
    <script>
        // 내부 자바스크립트(프로젝트 시 외부 js로 별도관리)
        //--------------------슬라이드2
        const event_bnr2 = new Swiper('.event_bnr2', {
            //옵션 문법
            //옵션:값, 옵션:값
            //슬라이드 효과
            // direction: 'horizontal', //기본값
            direction: 'vertical',//수직이동(swiper 세로크기 필수) ,vertical로 설정할때는 그 수직 세로값을 css에서 줘야함
            // effect:'fade',
            //반복
            loop:true,//기본값 false loop:true:방향에 따라 계속 반복 되는 것
            //자동재생
            autoplay:{
                delay:3000, /* 다음 슬라이드가 오기 전까지의 시간 */
                disableOnInteraction:false,
            },
            speed:200,
            //슬라이드 개수
            slidesPerView:2,
            //슬라이드 간격 flex gap동일
            spaceBetween:30,
        })
        //--------------------슬라이드3
        const event_bnr3 = new Swiper('.event_bnr3',{
            direction:'horizontal',
            // effect:'fade',
            loop:true,
            autoplay:{
                delay:6000,
                disableOnInteraction:false,
            },
            speed:400,
            slidesPerView:3,
            spaceBetween:50,
        })
    </script>
</body>
</html>
